name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  IMAGE_NAME: devops-atlas

jobs:
  # ---------------------------------------------------------------------------
  # 10. OWASP ZAP
  # ---------------------------------------------------------------------------
  owasp-zap:
    name: OWASP ZAP
    runs-on: ubuntu-latest
    needs: [docker-build]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OWASP ZAP
        run: |
          sudo apt-get update && sudo apt-get install -y zaproxy

      - name: Run OWASP ZAP baseline scan
        run: |
          zap-baseline.py -t http://localhost:3000 -r zap-report.html
          # Fail on critical errors, report warnings
          if [ -f zap-report.html ]; then
            critical_errors=$(grep -c "critical" zap-report.html || true)
            if [ "$critical_errors" -gt 0 ]; then
              echo "::error::Critical ZAP errors found"
              exit 1
            fi
          fi

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-report
          path: zap-report.html
