name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  IMAGE_NAME: devops-atlas

jobs:
  # ---------------------------------------------------------------------------
  # 1. ESLint (runs in parallel with other source checks)
  # ---------------------------------------------------------------------------
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ---------------------------------------------------------------------------
  # 2. Unit tests + coverage (runs in parallel with other source checks)
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm test -- --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # ---------------------------------------------------------------------------
  # 3. Gitleaks (runs in parallel with other source checks)
  # ---------------------------------------------------------------------------
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gitleaks
        run: |
          gitleaks protect --staged --verbose
          gitleaks protect --full --verbose

  # ---------------------------------------------------------------------------
  # 4. Semgrep (runs in parallel with other source checks)
  # ---------------------------------------------------------------------------
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep --config=p/owasp-top-ten --json --output=sarif.json .
          semgrep --config=p/owasp-top-ten --json --output=sarif.json .

  # ---------------------------------------------------------------------------
  # 5. npm audit (runs in parallel with other source checks)
  # ---------------------------------------------------------------------------
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # 6. Hadolint (runs in parallel with other source checks)
  # ---------------------------------------------------------------------------
  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hadolint
        run: |
          curl -sL https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint

      - name: Run Hadolint on Dockerfile
        run: |
          hadolint Dockerfile

  # ---------------------------------------------------------------------------
  # 7. Docker build (runs after source checks complete)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [eslint, test, gitleaks, semgrep, npm-audit, hadolint]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:scan
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 8. Trivy (runs after Docker build completes)
  # ---------------------------------------------------------------------------
  trivy-scan:
    name: Trivy
    runs-on: ubuntu-latest
    needs: [docker-build]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: table
          exit-code: "1"
          ignore-unfixed: "true"
          severity: CRITICAL,HIGH
          scanners: vuln
        env:
          TRA_TRIVY_SKIP_VERSION_CHECK: "true"

      - name: Trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: "true"
          severity: CRITICAL,HIGH
          scanners: vuln

      - name: Upload Trivy SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ---------------------------------------------------------------------------
  # 9. Syft SBOM (runs after Trivy completes)
  # ---------------------------------------------------------------------------
  syft-sbom:
    name: Syft SBOM
    runs-on: ubuntu-latest
    needs: [trivy-scan]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sL https://github.com/anchore/syft/releases/download/v0.81.0/syft_linux_amd64 -o /usr/local/bin/syft
          chmod +x /usr/local/bin/syft

      - name: Generate SBOM
        run: |
          syft docker:${{ env.IMAGE_NAME }}:scan -o cyclonedx > sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: syft-sbom
          path: sbom.json

  # ---------------------------------------------------------------------------
  # 10. OWASP ZAP (runs after Docker build, baseline errors block, warnings reported)
  # ---------------------------------------------------------------------------
  owasp-zap:
    name: OWASP ZAP
    runs-on: ubuntu-latest
    needs: [docker-build]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OWASP ZAP
        run: |
          sudo apt-get update && sudo apt-get install -y zaproxy

      - name: Run OWASP ZAP baseline scan
        run: |
          zap-baseline.py -t http://localhost:3000 -r zap-report.html
          # Fail on critical errors, report warnings
          if [ -f zap-report.html ]; then
            critical_errors=$(grep -c "critical" zap-report.html || true)
            if [ "$critical_errors" -gt 0 ]; then
              echo "::error::Critical ZAP errors found"
              exit 1
            fi
          fi

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-report
          path: zap-report.html

  # ---------------------------------------------------------------------------
  # 11. Push to Docker Hub (main branch / version tags only)
  # ---------------------------------------------------------------------------
  push:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [trivy-scan]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker Hub credentials
        id: creds
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not configured; skipping Docker Hub push."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.creds.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.creds.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        if: steps.creds.outputs.available == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        if: steps.creds.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
