name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  IMAGE_NAME: devops-atlas

jobs:
  # ---------------------------------------------------------------------------
  # 9. Syft SBOM
  # ---------------------------------------------------------------------------
  syft-sbom:
    name: Syft SBOM
    runs-on: ubuntu-latest
    needs: [trivy-scan]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sL https://github.com/anchore/syft/releases/download/v0.81.0/syft_linux_amd64 -o /usr/local/bin/syft
          chmod +x /usr/local/bin/syft

      - name: Generate SBOM
        run: |
          syft docker:${{ env.IMAGE_NAME }}:scan -o cyclonedx > sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: syft-sbom
          path: sbom.json
